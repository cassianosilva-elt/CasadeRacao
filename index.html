<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa de Ração LOPES | O Cuidado Que Seu Pet Merece</title>
    <meta name="description" content="A Casa de Ração LOPES oferece as melhores rações, brinquedos e medicamentos para cães, gatos e outros pets. Entrega rápida em SP." />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="google-site-verification" content="googleca1d1cc3b2ce3be8" />
    <link rel="canonical" href="https://casalopes.netlify.app/" />
    
    <!-- Google Fonts (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet"></noscript>

    
    <!-- Open Graph -->
    <meta property="og:title" content="Casa de Ração LOPES" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Casa de Ração LOPES" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png">

    <!-- Anti-flash: aplica o tema salvo antes do React montar -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = saved ? saved === 'dark' : prefersDark;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
